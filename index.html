<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookando</title>
  <link rel="icon" type="image/png" href="images/livroaba.png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- NAVBAR FIXA -->
  <header class="bg-white shadow sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
      <a href="index.html" class="flex items-center"> 
        <img src="images/nome.png" alt="Logo" class="h-10 w-auto">
      </a>
      <nav class="space-x-6 text-gray-700 font-medium">
        <a href="livros.html" class="hover:text-blue-600">LIVROS</a>
        <a href="perfil.html" class="hover:text-blue-600">AVALIAÇÕES</a>
        <a href="solicitacao.html" class="hover:text-blue-600">SOLICITAÇÕES</a>
        <a href="login.html" class="text-red-600 font-semibold hover:text-red-700">SAIR</a>
      </nav>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="relative text-center flex flex-col items-center">

    <!-- BANNER -->
    <div class="w-full">
      <img src="images/Estampa.png" alt="Banner" class="w-full block">
    </div>

    <!-- BOTÕES NA ÁREA BRANCA -->
    <div class="flex gap-12 mt-10 z-10 flex-wrap justify-center">

      <a href="livros.html" class="block w-80 max-w-[90%]">
        <img src="images/livros.png"
             class="w-full h-auto block hover:opacity-90 transition">
      </a>

      <a href="perfil.html" class="block w-80 max-w-[90%]">
        <img src="images/avaliacao.png"
             class="w-full h-auto block hover:opacity-90 transition">
      </a>

    </div>

  </main>

  <!-- RODAPÉ -->
  <footer class="text-center text-sm text-gray-500 py-6 border-t mt-10">
    © 2025 - Projeto Avaliações. Desenvolvido para fins acadêmicos.
  </footer>

  <!-- EXIBIR NOME DO USUÁRIO LOGADO -->
  <script type="module">
    const usuario = JSON.parse(localStorage.getItem('usuarioLogado'))
    if (!usuario) {
      window.location.href = 'login.html'
    } else {
      console.log('Usuário logado:', usuario.nome)
    }
  </script>

</body>
</html>
