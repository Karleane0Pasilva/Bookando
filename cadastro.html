<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criar conta</title>
  <link rel="icon" type="image/png" href="images/livroaba.png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .container-form {
      position: relative;
      border-radius: 30px;
    }

    .img-top {
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      user-select: none;
      pointer-events: none;
    }

    .custom-button {
      background-image: url("images/criar.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      height: 55px;
      border-radius: 9999px;
      font-weight: bold;
    }

    input {
      border-radius: 9999px !important;
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 47px;
      transform: translateY(-50%);
      cursor: pointer;
      width: 24px;
      opacity: 0.7;
      transition: 0.15s;
    }
    .toggle-pass:hover {
      opacity: 1;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6"
style="background-image: url('images/faixas.png'); background-size: cover;">

  <main class="container-form w-full max-w-md bg-white shadow p-8 pt-20">

    <img src="images/tyler.png" class="img-top">

    <h1 class="text-2xl font-bold mb-1 text-center">Cadastro</h1>
    <p class="text-sm text-gray-600 mb-6 text-center">Crie sua conta para avaliar livros.</p>

    <form id="formCadastro" class="space-y-4" novalidate>
      <div>
        <label for="nome" class="block text-sm font-medium text-gray-700">Nome</label>
        <input id="nome" name="nome" type="text" required
               class="mt-1 w-full border px-4 py-2 outline-none focus:ring"
               placeholder="Seu nome completo">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
        <input id="email" name="email" type="email" required
               class="mt-1 w-full border px-4 py-2 outline-none focus:ring"
               placeholder="voce@email.com">
      </div>

      <div class="relative">
        <label for="senha" class="block text-sm font-medium text-gray-700">Senha</label>
        <input id="senha" name="senha" type="password" required pattern="[0-9]{6,10}"
               title="A senha deve conter apenas números, entre 6 e 10 dígitos."
               class="mt-1 w-full border px-4 py-2 outline-none focus:ring"
               placeholder="No mínimo 6 dígitos numéricos">

        <!-- Começa com o olho fechado -->
        <img id="eyeIcon" src="images/olhofechado.png" class="toggle-pass" onclick="toggleSenha()">
      </div>

      <button type="submit" class="w-full custom-button text-white"></button>

      <p id="mensagem" class="text-sm mt-2"></p>
    </form>

    <hr class="my-6">
    <p class="text-sm text-gray-600 text-center">
      Já tem conta?
      <a href="login.html" class="text-blue-600 hover:underline">Entrar</a>
    </p>

  </main>

  <!-- Script para mostrar/ocultar senha -->
  <script>
    function toggleSenha() {
      const input = document.getElementById("senha");
      const eye = document.getElementById("eyeIcon");

      if (input.type === "password") {
        input.type = "text";
        eye.src = "images/olhoaberto.png";
      } else {
        input.type = "password";
        eye.src = "images/olhofechado.png";
      }
    }
  </script>

  <!-- Supabase -->
  <script type="module">
    import { supabase } from './js/supabase.js'
    import { handleCadastro } from './js/auth.js'

    const form = document.getElementById('formCadastro')
    const msg  = document.getElementById('mensagem')

    form.addEventListener('submit', (e) => {
      e.preventDefault()
      const dados = {
        nome:  form.nome.value.trim(),
        email: form.email.value.trim(),
        senha: form.senha.value
      }
      handleCadastro(dados, msg) 
    })
  </script>

</body>
</html>
